<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Life RPG - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="auth-container">

        <!-- LOGO -->

        <div class="brand">

            <div class="brand-icon">
                ⚔️
            </div>

            <h1>LIFE RPG</h1>

            <p>
                Turn your real life into an adventure.
            </p>

        </div>


        <!-- LOGIN BOX -->

        <div class="auth-box">

            <h2>Welcome Back 👋</h2>

            <p class="box-text">
                Login to continue your adventure
            </p>


            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >


            <button
                class="main-button"
                onclick="login()">

                Login

            </button>


            <p
                id="loginMessage"
                class="message">
            </p>

        </div>


        <!-- SIGNUP BOX -->

        <div class="auth-box">

            <h2>Create Account 🚀</h2>

            <p class="box-text">
                Start your Life RPG journey
            </p>


            <input
                type="text"
                id="signupUsername"
                placeholder="Choose username"
            >


            <input
                type="password"
                id="signupPassword"
                placeholder="Choose password"
            >


            <button
                class="main-button"
                onclick="signup()">

                Create Account

            </button>


            <p
                id="signupMessage"
                class="message">
            </p>

        </div>


        <footer>

            ⚔️ Life RPG — Level Up Your Real Life

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
